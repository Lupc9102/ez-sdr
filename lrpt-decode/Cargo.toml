[package]
name = "lrpt-decode"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Clean-room Meteor-M2 LRPT decoding pipeline (QPSK demod, CCSDS frame sync, Reed-Solomon, image reconstruction)"
license = "MIT OR Apache-2.0"
authors = ["Lupc9102"]
repository = "https://github.com/Lupc9102/ez-sdr"

[dependencies]
num-complex = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
crossbeam-channel = { workspace = true }
image = { workspace = true }

[lints]
workspace = true
