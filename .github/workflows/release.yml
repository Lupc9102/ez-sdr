name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libasound2-dev libpulse-dev librtlsdr-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked --release --features ez-daemon/rtlsdr,dump1090/rtlsdr
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: ez-sdr-binaries
          path: |
            target/release/dump1090
            target/release/ez-gui
            target/release/ez-daemon
