name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libasound2-dev libpulse-dev librtlsdr-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - name: Build licensed Linux release archive
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: scripts/package-linux-release.sh dist
      - name: Upload licensed Linux release archive
        uses: actions/upload-artifact@v7
        with:
          name: ez-sdr-${{ github.ref_name }}-linux-x86_64
          path: dist/ez-sdr-${{ github.ref_name }}-linux-x86_64.tar.gz
          if-no-files-found: error
