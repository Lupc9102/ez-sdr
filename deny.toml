[advisories]
version = 2
ignore = [
    # bincode 1.x has no known CVE; codec frame/allocation bounds are tested.
    # Migration changes the encoding and requires a versioned rollout through
    # the enforced Hello/Welcome handshake.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x unmaintained; bounded codec and enforced protocol versions; migrate with a versioned wire rollout" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "NCSA",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "MIT-0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    # Required by translated dump1090-mutability modules and rtlsdr_sys (GPL-2.0+).
    "GPL-2.0-or-later",
]

[bans]
multiple-versions = "allow"
