[advisories]
version = 2
ignore = [
    # Transitive quick-xml via wayland-scanner/zbus_xml - no upgrade available
    { id = "RUSTSEC-2026-0194", reason = "wayland-scanner and zbus_xml locked to quick-xml 0.39.4; no newer version available" },
    { id = "RUSTSEC-2026-0195", reason = "wayland-scanner and zbus_xml locked to quick-xml 0.39.4; no newer version available" },
    # Transitive rustls-webpki via rumqttc - no upgrade available
    { id = "RUSTSEC-2026-0099", reason = "rumqttc 0.25.1 locked to rustls-webpki 0.102.8; no newer version available" },
    { id = "RUSTSEC-2026-0104", reason = "rumqttc 0.25.1 locked to rustls-webpki 0.102.8; no newer version available" },
    { id = "RUSTSEC-2026-0049", reason = "rumqttc 0.25.1 locked to rustls-webpki 0.102.8; no newer version available" },
    { id = "RUSTSEC-2026-0098", reason = "rumqttc 0.25.1 locked to rustls-webpki 0.102.8; no newer version available" },
    # Unmaintained transitive deps - no replacement available
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; no replacement available yet" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is unmaintained; no replacement available yet" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; no replacement available yet" },
    # Unmaintained direct dep (ez-proto wire format). bincode 1.3.3 has no known
    # CVE; usage here is bounded (64 KiB/1 MiB outer frames, serde cautious
    # prealloc, flat non-recursive types — see ez-proto/src/codec.rs). Migrating
    # to bincode 2 changes the wire encoding and must follow PROTOCOL_VERSION
    # handshake enforcement (currently decorative), so it is a separate
    # versioned-protocol goal, not a silent swap. Revisit then.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x unmaintained but CVE-free; wire migration needs versioned rollout, tracked as follow-up" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "NCSA",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "MIT-0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
