[advisories]
version = 2

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "NCSA",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "MIT-0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
skip-tree = [
    { name = "calloop", version = "0.13" },
    { name = "rustix", version = "0.38" },
    { name = "linux-raw-sys", version = "0.4" },
    { name = "hashbrown", version = "0.14" },
    { name = "foldhash", version = "0.1" },
]
