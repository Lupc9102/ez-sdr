[workspace]
members = ["dump1090", "ez-gui"]
resolver = "2"

[profile.release]
lto = true
strip = "symbols"

[profile.dev]
split-debuginfo = "unpacked"
debug = 1

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
num-complex = "0.4"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
