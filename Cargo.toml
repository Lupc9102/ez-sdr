[workspace]
members = ["dump1090", "ez-gui", "lrpt-decode", "ez-proto", "ez-daemon"]
resolver = "2"

[profile.release]
lto = true
strip = "symbols"

[profile.dev]
split-debuginfo = "unpacked"
debug = 1

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
num-complex = "0.4"
rustfft = "6"
tokio = "1"
tokio-util = "0.7"
bincode = "1"
bytes = "1"
arc-swap = "1.7"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = "4"
pkg-config = "0.3"
ez-proto = { path = "ez-proto" }
dump1090 = { path = "dump1090" }
lrpt-decode = { path = "lrpt-decode" }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
